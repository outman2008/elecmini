name: ElecMini CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: 全套检查（Linux）
    runs-on: ubuntu-22.04  # 对齐最低支持系统（WebKitGTK 2.40+ 基线）
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb chromium \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 cargo 镜像（可选加速）
        run: mkdir -p ~/.cargo && printf '[source.crates-io]\nreplace-with = "tuna"\n[source.tuna]\nregistry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"\n' > ~/.cargo/config.toml || true

      - name: 运行全套检查
        run: bash ci/check.sh

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elecmini-reports
          path: |
            compat/results/
            contract/results/
            dist/*.json
          if-no-files-found: ignore
