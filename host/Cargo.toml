[package]
name = "elecmini-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ElecMini native host: tao event loop + wry system WebView"

# win_gate 是 Windows 专用门禁探测器（#![cfg(windows)]），仅交叉编译/Windows 时构建
[[bin]]
name = "win_gate"
path = "src/bin/win_gate.rs"
required-features = ["windows-gate"]

[features]
windows-gate = []

[dependencies]
# wry/tao 是 Tauri 的底座；版本组合经 Tauri 生态验证
# devtools feature：让 WebView::open_devtools 在 release 构建可用（macOS/Linux Web Inspector）
tao = "0.34"
wry = { version = "0.52", features = ["devtools"] }
# P6-H：系统托盘。tray-icon 0.24.x 依赖 tao ^0.34 / muda ^0.19.1 / gtk ^0.18，
# 与本项目 tao 0.34、已锁定的 gtk 0.18.2 同系列，避免类型版本冲突。
tray-icon = "0.24.2"
muda = "0.19.3"
# 托盘图标 dataURL（PNG/ICO）解码：PNG 是压缩格式，不能直接当 RGBA 送 Icon::from_rgba
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"

# S4：Windows WebView2 专属能力（WebResourceRequested / CDP / DevTools）
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
