<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ElecMini logo">
  <title>ElecMini — Electron API contract, system WebView rendering</title>
  <defs>
    <linearGradient id="ring" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="core" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#7c3aed" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- one open, lightweight orbit -->
  <path d="M 83.3 41 A 30 30 0 0 1 64 94 A 30 30 0 0 1 34 64"
        fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" filter="url(#soft)"/>

  <!-- the preserved JS API core -->
  <circle cx="64" cy="64" r="13" fill="url(#core)" filter="url(#soft)"/>

  <!-- three platforms: WebView2 / WKWebView / WebKitGTK -->
  <g filter="url(#soft)">
    <circle cx="64" cy="15" r="6.5" fill="#22d3ee"/>
    <circle cx="107" cy="89" r="6.5" fill="#a78bfa"/>
    <circle cx="21" cy="89" r="6.5" fill="#fb7185"/>
  </g>
</svg>
