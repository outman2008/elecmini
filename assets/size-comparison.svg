<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="ElecMini vs Electron bundled engine size comparison">
  <title>Bundled engine size: ElecMini vs Electron (measured, Linux x64)</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { fill:#e6edf3; font-size:20px; font-weight:700; }
    .s { fill:#8b949e; font-size:12px; }
    .l { fill:#c9d1d9; font-size:13px; }
    .bar { rx:5; }
    .v { fill:#e6edf3; font-size:13px; font-weight:700; }
  </style>
  <rect width="760" height="360" fill="#0d1117"/>

  <text x="28" y="40" class="t h">Shipped engine size (Linux x64, measured)</text>
  <text x="28" y="60" class="t s">Smaller is better · logarithmic scale · what you bundle, not total app size</text>

  <!-- scale: log10(bytes) mapped; 100KB -> x=250, 300MB -> x=720 -->
  <!-- ElecMini runtime: 469,408 bytes unpacked -->
  <text x="28" y="104" class="t l">ElecMini · JS runtime</text>
  <rect x="250" y="90" width="17" height="22" class="bar" fill="#38bdf8"/>
  <text x="275" y="105" class="t v">469 KB</text>

  <!-- ElecMini Rust host: 1,872,280 bytes -->
  <text x="28" y="144" class="t l">ElecMini · Rust host</text>
  <rect x="250" y="130" width="40" height="22" class="bar" fill="#38bdf8"/>
  <text x="298" y="145" class="t v">1.8 MB</text>

  <!-- ElecMini total callout -->
  <text x="28" y="184" class="t l" font-weight="700">ElecMini · total</text>
  <rect x="250" y="170" width="57" height="22" class="bar" fill="#7ef9ff"/>
  <text x="315" y="185" class="t v">~2.3 MB</text>

  <!-- Electron dist: 274 MB -->
  <text x="28" y="234" class="t l">Electron · bundled Chromium dist</text>
  <rect x="250" y="220" width="470" height="22" class="bar" fill="#f97316"/>
  <text x="690" y="235" class="t v">274 MB</text>

  <!-- Electron main binary: 224 MB -->
  <text x="28" y="274" class="t l">Electron · electron binary alone</text>
  <rect x="250" y="260" width="462" height="22" class="bar" fill="#fbbf24"/>
  <text x="682" y="275" class="t v">224 MB</text>

  <!-- ratio -->
  <rect x="250" y="306" width="470" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="268" y="328" class="t" fill="#7ef9ff" font-size="15" font-weight="700">~118x smaller engine footprint</text>

  <text x="28" y="352" class="t s">Measured via npm pack --dry-run / stat / du, Electron 45.x. System WebView is a shared OS dependency (not bundled).</text>
</svg>
